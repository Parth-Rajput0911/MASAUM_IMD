<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      (function () {
        const origError = console.error;
        console.error = function (...args) {
          if (
            args.some(
              (arg) =>
                typeof arg === 'string' &&
                (arg.includes('failed to connect to websocket') ||
                  arg.includes('WebSocket closed') ||
                  arg.includes('[vite] failed to connect'))
            )
          ) {
            return;
          }
          origError.apply(console, args);
        };
        window.addEventListener('unhandledrejection', function (event) {
          const reason = event.reason;
          if (
            reason &&
            (String(reason.message || reason).includes('WebSocket closed') ||
              String(reason.message || reason).includes('failed to connect to websocket'))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>
    <title>MAUSAM IMD</title>
    <meta name="description" content="AI-powered, context-aware personalized weather intelligence mobile application." />
    <meta property="og:title" content="MAUSAM IMD" />
    <meta property="og:description" content="AI-powered, context-aware personalized weather intelligence mobile application." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

  </head>

  </body>
</html>
